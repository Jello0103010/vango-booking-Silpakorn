<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จองรถ | VanGo Booking</title><link rel="stylesheet" href="style.css"></head><body><header><nav class="nav"><a class="brand" href="index.html">🚐 VanGo Booking</a><div class="links"><a href="index.html">หน้าแรก</a><a class="active" href="booking.html">จองรถ</a><a href="history.html">ประวัติการจอง</a></div></nav></header><main><span class="eyebrow">จองรถตู้</span><h1>กรอกข้อมูลการเดินทาง</h1><p class="muted">เส้นทางหน้า ม.ศิลปากร → 3 เส้นทาง | สามารถจองได้ภายใน 7 วันล่วงหน้า</p><form class="panel" id="booking-form"><div class="formgrid"><div><label for="travel-route">เลือกปลายทาง</label><select id="travel-route" required></select></div><div><label for="travel-date">วันที่เดินทาง</label><select id="travel-date" required></select></div><div><label for="travel-time">เวลาออกรถ</label><select id="travel-time" required></select><small id="availability"></small></div><div><label for="passenger-count">จำนวนผู้โดยสาร</label><input id="passenger-count" type="number" min="1" max="19" value="1" required></div><div><label for="customer-name">ชื่อ–นามสกุลผู้จอง</label><input id="customer-name" maxlength="100" autocomplete="name" required placeholder="ชื่อและนามสกุล"></div><div><label for="customer-phone">เบอร์โทรศัพท์</label><input id="customer-phone" type="tel" maxlength="10" inputmode="numeric" autocomplete="tel" required placeholder="08XXXXXXXX"></div></div><div class="summary"><p id="price-label">ค่าโดยสารจำลองตามเส้นทาง</p><h2>ยอดรวม: <strong id="total">120 บาท</strong></h2><small>ไม่มีการชำระเงินผ่านเว็บไซต์นี้</small></div><div id="feedback" aria-live="polite"></div><button id="confirm" class="btn" type="submit">ยืนยันการจอง</button></form></main><footer>© VanGo Booking | โครงงานเว็บไซต์จำลองสำหรับการศึกษา</footer><script src="app.js"></script></body></html>
